<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manejo de Drogas e Distúrbios Clínicos | IAMSPE</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1f2a37;--mut:#66758a;--line:#d5dce6;--field:#fff;--head:#0E2A47;--c:#0F7C8C;
  --tip:#FBF3E2;--tipb:#C79A3B;--al:#F9E9EE;--alb:#C8323C;--nt:#eef1f6;--ntb:#8793a5;--ad:#e8f1ff;--adb:#3b7bd6}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212c;--ink:#e6ebf2;--mut:#93a1b5;--line:#2c3848;--field:#111821;
  --head:#0a1a2c;--tip:#3a3016;--al:#3d1c25;--nt:#222c3a;--ad:#172a45}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
header{background:var(--head);color:#fff;padding:10px 14px 8px}
.site-return{display:inline-block;margin-bottom:6px;font-size:13px;font-weight:600;color:#fff;opacity:.85;text-decoration:none}
.site-return:hover{text-decoration:underline;opacity:1}
header h1{font-size:17px;font-weight:800;letter-spacing:-.01em}
header h1 small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.7}
.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:8px 14px 0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pt{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.pt label{display:flex;flex-direction:column;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.95;gap:2px}
.pt input,.pt select{width:86px;font:inherit;font-size:16px;font-weight:700;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff}
.pt select option{color:#000}
.pt .kg input{width:96px;background:#fff;color:#0E2A47}
.pt .sr{flex:1;min-width:150px}.pt .sr input{width:100%;font-weight:500}
.pt input::placeholder{color:rgba(255,255,255,.5);font-weight:400}.pt .kg input::placeholder{color:#8a96a8}
.pt button{font:inherit;font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer}
.der{font-size:12px;opacity:.85;padding:5px 0 2px;min-height:22px}
nav{display:flex;gap:4px;overflow-x:auto;padding:6px 0 0;scrollbar-width:thin}
nav button{flex:none;font:inherit;font-size:13px;font-weight:700;padding:8px 12px;border:0;border-radius:9px 9px 0 0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;white-space:nowrap;border-top:3px solid var(--c)}
nav button.on{background:var(--bg);color:var(--ink)}
main{padding:14px;max-width:1500px;margin:0 auto}
.tab{display:none}.tab.on,.searching .tab{display:block}
.tab>h2{font-size:20px;font-weight:800;margin:4px 0 10px;color:var(--c)}
.searching .tab.empty{display:none}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
.bar2 button{font:inherit;font-weight:700;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--c);background:transparent;color:var(--c);cursor:pointer}
.bar2 button.on{background:var(--c);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.blk.wide{grid-column:1/-1}
.blk.hide{display:none}
.bh{background:var(--c);color:#fff;padding:7px 12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 10px}
.bh b{font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
.bh small{font-size:12px;opacity:.95;margin-left:auto}
.bh label{font-size:12px;font-weight:700;display:flex;gap:5px;align-items:center;cursor:pointer}
.bb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.w{display:flex;flex-direction:column;gap:7px}
.w+.w{border-top:1px dashed var(--line);padding-top:10px}
.wt{font-weight:800;color:var(--c);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:7px}
.fd{display:flex;flex-direction:column;gap:2px;min-width:0}
.fl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--mut);display:flex;justify-content:space-between;gap:4px;align-items:baseline}
.fl i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;white-space:nowrap}
.fi{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--field);overflow:hidden}
.fi:focus-within{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.fi input,.fi select{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:700;padding:7px 8px;outline:0}
.fi select{font-size:14px;font-weight:600}
.fi span{font-size:11.5px;color:var(--mut);padding-right:8px;white-space:nowrap;font-weight:600}
.fd.big .fi{border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--field))}
.fd.big input{font-size:19px;color:var(--c)}
.fd.out .fi{border-style:dashed;background:transparent}
.fd.lo .fi{border-color:#d69e2e;background:color-mix(in srgb,#d69e2e 14%,var(--field))}
.fd.hi .fi{border-color:#C8323C;background:color-mix(in srgb,#C8323C 13%,var(--field))}
.fd.lo .fl i{color:#b7791f}.fd.hi .fl i{color:#C8323C}
.fd.add .fl:after{content:'acrescentado';font-size:9px;background:var(--ad);color:var(--adb);border-radius:99px;padding:0 6px;letter-spacing:0;text-transform:none}
.wm{display:flex;flex-direction:column;gap:4px;font-size:13px}
.wm div{padding:5px 9px;border-radius:7px;background:color-mix(in srgb,var(--c) 7%,transparent);border-left:3px solid var(--c)}
.wm .warn{background:var(--tip);border-color:var(--tipb)}
.wm .bad{background:var(--al);border-color:var(--alb);font-weight:600}
.wm .add{background:var(--ad);border-color:var(--adb)}
.wm .res{font-size:15px;font-weight:700}
.wm table{border-collapse:collapse;width:100%}.wm td,.wm th{padding:3px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
.wm th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
details{border-top:1px solid var(--line);padding-top:8px;font-size:13.5px}
summary{cursor:pointer;font-weight:700;color:var(--c);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
details ul{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:8px}
details li{padding:5px 9px;border-radius:7px;background:var(--nt);border-left:3px solid var(--ntb)}
details li.tip{background:var(--tip);border-color:var(--tipb)}
details li.al{background:var(--al);border-color:var(--alb)}
details li.add{background:var(--ad);border-color:var(--adb)}
details li.pl{background:transparent;border-color:var(--line)}
.tag{font-size:9.5px;background:var(--ad);color:var(--adb);border-radius:99px;padding:1px 6px;font-weight:700;white-space:nowrap}
footer{padding:18px 14px 28px;text-align:center;font-size:12px;color:var(--mut)}
#none{display:none;padding:30px;text-align:center;color:var(--mut)}
@media (max-width:560px){body{font-size:14px}.pt input,.pt select{width:68px;padding:5px 6px}.pt .kg input{width:76px}main{padding:10px}header{padding:8px 10px 4px}.top{padding:6px 10px 0}}
</style>

<body>
<header><a class="site-return" href="../ferramentas/index.html">← Voltar para Ferramentas</a><h1><small>IAMSPE · Guia de bolso</small>Manejo de drogas e distúrbios clínicos</h1></header>
<div class="top">
  <div class="pt">
    <label class="kg">Peso (kg)<input id="g_kg" inputmode="decimal" autocomplete="off" placeholder="kg"></label>
    <label>Sexo<select id="g_sex"><option value="">—</option><option value="M">Masc.</option><option value="F">Fem.</option></select></label>
    <label>Idade<input id="g_age" inputmode="numeric" autocomplete="off" placeholder="anos"></label>
    <label>Altura (cm)<input id="g_h" inputmode="decimal" autocomplete="off" placeholder="cm"></label>
    <label class="sr">Buscar droga<input id="q" type="search" autocomplete="off" placeholder="ex.: noradrenalina"></label>
    <button id="clr" type="button">Limpar tudo</button>
  </div>
  <div class="der" id="der"></div>
  <nav id="nav"></nav>
</div>
<main id="main"></main>
<div id="none">Nada encontrado.</div>
<footer>Manejo de Drogas e Distúrbios Clínicos | IAMSPE · Campos e notas com a etiqueta <span class="tag">acrescentado</span> não constam no conteúdo original.</footer>

<script>
'use strict';
/* ============ utilidades ============ */
const $=(s,e=document)=>e.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e;};
const num=s=>{s=String(s==null?'':s).trim().replace(/\s/g,'').replace(',','.');return s===''?NaN:Number(s);};
function fmt(x,d){if(!isFinite(x))return '';if(d==null){const a=Math.abs(x);d=a>=100?1:a>=1?2:a>=.1?3:4;}
  let s=(+x.toFixed(d)).toString();if(s.includes('e'))s=x.toFixed(d);return s.replace('.',',');}
const ok=(...a)=>a.every(isFinite);
const same=(a,b)=>(a===b)||(typeof a==='number'&&typeof b==='number'&&((isNaN(a)&&isNaN(b))||Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a),Math.abs(b))));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const ADD='<span class="tag">acrescentado</span> ';

/* ============ estado global (paciente) ============ */
const G={kg:NaN,sex:'',age:NaN,h:NaN};
let ALL=[];
function actFactor(){if(!G.sex)return NaN;const old=isFinite(G.age)&&G.age>=60;return G.sex==='M'?(old?.5:.6):(old?.45:.5);}
const ACT=()=>G.kg*actFactor();
function ideal(){if(!G.sex||!isFinite(G.h))return NaN;return (G.sex==='M'?50:45.5)+0.91*(G.h-152.4);}

/* ============ motor de widgets (cálculo bidirecional) ============ */
function W(spec){
  const el=h('div','w');if(spec.t)el.append(h('div','wt',spec.t));
  const grid=h('div','wg');el.append(grid);const msg=h('div','wm');el.append(msg);
  const v={},inp={},lab={},order=[];
  const S={newer:(...ks)=>{for(const k of order)if(ks.includes(k))return k;return ks[0];},
           touch:k=>{const i=order.indexOf(k);if(i>=0)order.splice(i,1);order.unshift(k);},has:k=>order.includes(k)};
  spec.f.forEach(f=>{
    const l=h('label','fd'+(f.out?' out':'')+(f.big?' big':'')+(f.add?' add':''));
    const fl=h('span','fl',`<span>${f.l}</span>`);const rg=h('i');fl.append(rg);l.append(fl);
    const box=h('div','fi');let i;
    if(f.opts){i=h('select');f.opts.forEach(([a,b])=>i.append(new Option(b,a)));i.value=f.v!=null?f.v:f.opts[0][0];}
    else{i=h('input');i.type='text';i.inputMode='decimal';i.autocomplete='off';if(f.out){i.readOnly=true;i.tabIndex=-1;}
      if(f.v!=null)i.value=fmt(f.v,f.d);if(f.ph)i.placeholder=f.ph;}
    box.append(i);if(f.u)box.append(h('span','',f.u));l.append(box);grid.append(l);inp[f.k]=i;lab[f.k]={l,rg};
    if(!f.out)i.addEventListener(f.opts?'change':'input',()=>{S.touch(f.k);run(f.k);});
  });
  function run(ch){
    spec.f.forEach(f=>v[f.k]=f.opts?inp[f.k].value:num(inp[f.k].value));
    const before=Object.assign({},v),m=[];
    spec.calc(v,ch,S,m);
    spec.f.forEach(f=>{const i=inp[f.k];
      if(f.opts){if(i.value!==String(v[f.k]))i.value=v[f.k];return;}
      if(f.k!==ch&&(f.out||!same(v[f.k],before[f.k])))i.value=fmt(v[f.k],f.d);
      const r=typeof f.r==='function'?f.r(v):f.r,{l,rg}=lab[f.k];l.classList.remove('lo','hi');
      if(r){rg.textContent='faixa '+(r[0]!=null?fmt(r[0]):'')+(r[1]!=null?(r[0]!=null?'–':'até ')+fmt(r[1]):'+');
        if(isFinite(v[f.k])){if(r[0]!=null&&v[f.k]<r[0]-1e-9)l.classList.add('lo');if(r[1]!=null&&v[f.k]>r[1]+1e-9)l.classList.add('hi');}}
    });
    msg.innerHTML=m.map(x=>Array.isArray(x)?`<div class="${x[0]}">${x[1]}</div>`:`<div>${x}</div>`).join('');
    if(spec.on)spec.on(v);
  }
  ALL.push(()=>run(null));el._v=v;run('init');return el;
}
/* campos proporcionais a uma grandeza-base: editar qualquer um recalcula os demais */
function lin(v,S,fac){const ks=Object.keys(fac),src=S.newer(...ks),base=v[src]/fac[src];ks.forEach(k=>{if(k!==src)v[k]=base*fac[k];});return base;}
function LIN(o){return W({t:o.t,f:o.f,calc(v,ch,S,m){const fac={};o.f.forEach(f=>{if(f.fac)fac[f.k]=f.fac(v);});lin(v,S,fac);if(o.msg)o.msg(v,m);}});}
const needKg=m=>{if(!isFinite(G.kg))m.push(['warn','Informe o peso no topo para calcular por kg.']);};

/* infusão contínua: diluição (pronta ou personalizada) → concentração; dose ⇄ mL/h */
function INF(o){
  const P=o.p,cf=o.cf||1,df=o.df||1,t=o.per==='min'?60:1;
  const f=[{k:'preset',l:'Diluição',opts:P.map((p,i)=>[String(i),p.n]).concat([['c','Personalizada']]),v:String(o.def||0)},
    {k:'amt',l:'Droga na solução',u:o.aU,add:o.addPrep},{k:'vol',l:'Volume final',u:'mL',d:1,add:o.addPrep},{k:'conc',l:'Concentração',u:o.cU},
    {k:'dose',l:o.dl||'Dose',u:o.dU,r:o.r,v:o.dv,big:1},{k:'rate',l:'Velocidade',u:'mL/h',d:1,big:1}];
  return W({t:o.t,f,calc(v,ch,S,m){
    if(['amt','vol','conc'].includes(ch))v.preset='c';
    const p=P[v.preset];
    if(p&&(ch==='init'||ch==='preset'||p.fn)){v.amt=p.fn?p.fn():p.amt;v.vol=p.vol;}
    if(ch==='conc')v.amt=v.conc*v.vol/cf;else v.conc=v.amt*cf/v.vol;
    const q=(o.kg?G.kg:1)*t*df/v.conc;
    if(S.newer('dose','rate')==='rate')v.dose=v.rate/q;else v.rate=v.dose*q;
    if(p&&p.txt)m.push('<b>Preparo:</b> '+(typeof p.txt==='function'?p.txt():p.txt));
    else if(o.amp&&ok(v.amt,v.vol)){const ml=v.amt/o.amp.a*o.amp.ml;
      m.push(`<b>Preparo:</b> ${fmt(v.amt)} ${o.aU} = ${fmt(ml,1)} mL de droga (${fmt(v.amt/o.amp.a,1)} ampola(s) de ${o.amp.lab}) + ${fmt(v.vol-ml,1)} mL de diluente → volume final ${fmt(v.vol,1)} mL`);
      if(ml>v.vol)m.push(['bad','O volume de droga é maior que o volume final informado.']);}
    if(ok(v.conc))m.push(`<b>Conversão:</b> ${o.dU} = ${o.kg?'(mL/h ÷ peso)':'mL/h'} × ${fmt(v.conc/(t*df),4)}`);
    if(o.kg)needKg(m);
    if(o.msg)o.msg(v,m);
  }});
}
/* bolus: dose/kg ⇄ dose total ⇄ volume */
function BOL(o){
  const multi=Array.isArray(o.c),f=[];
  if(multi)f.push({k:'prep',l:'Preparo',opts:o.c.map((x,i)=>[String(i),x[0]]),v:String(o.def||0)});
  f.push({k:'conc',l:'Concentração',u:o.cU,add:o.addC});
  if(o.kg)f.push({k:'dkg',l:'Dose por kg',u:o.mU+'/kg',r:o.r,v:o.dv,big:1});
  f.push({k:'dose',l:o.kg?'Dose total':'Dose',u:o.mU,r:o.kg?null:o.r,v:o.kg?null:o.dv,big:1},{k:'vol',l:'Volume',u:'mL',big:1});
  return W({t:o.t,f,on:o.on,calc(v,ch,S,m){
    if(ch==='init'||ch==='prep')v.conc=multi?o.c[v.prep][1]:o.c;
    const fac={};if(o.kg)fac.dkg=1/G.kg;fac.dose=1;fac.vol=v.conc;
    const ks=o.kg?['dkg','dose','vol']:['dose','vol'],src=S.newer(...ks);
    let base=src==='vol'?v.vol*v.conc:v[src]/fac[src];
    if(o.cap&&base>o.cap+1e-9){if(src==='dkg'){base=o.cap;m.push(['warn',`Teto de ${fmt(o.cap)} ${o.mU} aplicado.`]);}else m.push(['bad',`Acima do máximo de ${fmt(o.cap)} ${o.mU}.`]);}
    if(src!=='dose')v.dose=base;if(src!=='vol')v.vol=base/v.conc;if(o.kg&&src!=='dkg')v.dkg=base/G.kg;
    if(o.kg&&o.r&&ok(G.kg,v.conc)){const a=o.r[0]*G.kg,b=o.cap?Math.min(o.r[1]*G.kg,o.cap):o.r[1]*G.kg;
      m.push(`<b>Faixa para ${fmt(G.kg,1)} kg:</b> ${fmt(Math.min(a,b))} a ${fmt(b)} ${o.mU} = ${fmt(Math.min(a,b)/v.conc,1)} a ${fmt(b/v.conc,1)} mL`);}
    if(o.kg)needKg(m);
    if(o.msg)o.msg(v,m);
  }});
}
/* dose fixa em volume conhecido correndo em um tempo */
function RUN(o){return W({t:o.t,f:[{k:'mg',l:'Dose',u:'mg',v:o.mg},{k:'vol',l:'Volume da solução',u:'mL',v:o.vol,d:1,add:o.addV},
  {k:'min',l:'Tempo',u:'min',v:o.min,d:1},{k:'rate',l:'Velocidade',u:'mL/h',d:1,big:1},{k:'mgmin',l:'Taxa',u:'mg/min',out:1}],
  calc(v,ch,S){if(S.newer('min','rate')==='rate')v.min=v.vol/v.rate*60;else v.rate=v.vol/v.min*60;v.mgmin=v.mg/v.min;}});}

/* ============ conteúdo ============ */
const TABS=[];
function TAB(n,t,c){const o={n,t,c,b:[]};TABS.push(o);return o;}
/* notas: prefixo ! = alerta, * = observação/dica, ~ = correção, + = acrescentado */
function B(tab,title,subt,widgets,notes,opt){tab.b.push(Object.assign({title,subt,widgets,notes:notes||[]},opt||{}));}

function buildData(){
TABS.length=0;
const amp=(a,ml,u)=>({a,ml,lab:`${fmt(a)} ${u}/${fmt(ml)} mL`});

/* ---------- 1. Drogas vasoativas ---------- */
let T=TAB(1,'Drogas vasoativas','#0F7C8C');
B(T,'1.1 Noradrenalina','4 mg/4 mL',()=>[INF({p:[{n:'Padrão (64 mcg/mL)',amt:16,vol:250,txt:'4 ampolas (16 mg/16 mL) + SG 5% 234 mL → volume final 250 mL'},
  {n:'Concentrada (128 mcg/mL)',amt:32,vol:250,txt:'8 ampolas (32 mg/32 mL) + SG 5% 218 mL → volume final 250 mL'}],
  aU:'mg',cf:1000,cU:'mcg/mL',dU:'mcg/kg/min',kg:1,per:'min',r:[.01,3],amp:amp(4,4,'mg')})],
 ['Dose: titular conforme PAM, perfusão e resposta clínica. A faixa original é de 0,01 a 3 mcg/kg/min, mas doses elevadas exigem reavaliação frequente.',
  '*Preferir acesso venoso central para infusão prolongada ou concentrada.']);
B(T,'1.2 Vasopressina','20 U/mL',()=>[INF({p:[{n:'Padrão (0,2 U/mL)',amt:20,vol:100,txt:'20 U (1 mL) + SF 0,9% 99 mL → volume final 100 mL'},
  {n:'Concentrada (0,4 U/mL)',amt:40,vol:100,txt:'40 U (2 mL) + SF 0,9% 98 mL → volume final 100 mL'}],
  aU:'U',cU:'U/mL',dU:'U/min',per:'min',r:[.01,.04],dv:.03,amp:amp(20,1,'U'),
  msg(v,m){if(ok(v.conc))m.push(`0,01 a 0,04 U/min = ${fmt(.6/v.conc,1)} a ${fmt(2.4/v.conc,1)} mL/h`);}})],
 ['Dose usual no choque séptico: 0,03 U/min, como adjuvante à noradrenalina.',
  '!Não titular rotineiramente como uma catecolamina. Doses superiores aumentam o risco de isquemia.']);
B(T,'1.3 Adrenalina','1 mg/mL',()=>[INF({p:[{n:'Padrão (64 mcg/mL)',amt:16,vol:250,txt:'16 ampolas (16 mg/16 mL) + SG 5% até volume final de 250 mL (234 mL de diluente)'}],
  aU:'mg',cf:1000,cU:'mcg/mL',dU:'mcg/kg/min',kg:1,per:'min',r:[.01,1],amp:amp(1,1,'mg')})],

  calc(v,ch,S,m){const iam=v.ind==='iam',cap=iam?4000:5000;
   if(ch==='init'||ch==='ind'){v.bkg=iam?60:80;v.ikg=iam?12:18;S.touch('bkg');S.touch('ikg');}

   else{v.bol=v.bkg*G.kg;if(v.bol>cap){v.bol=cap;m.push(['warn',`Teto de ${fmt(cap,0)} U aplicado ao ataque${iam?'':' (teto do documento)'}.`]);}}
   v.bp=v.bol/5000;v.bd=v.bol/v.conc;
   const src=S.newer('ikg','uh','rate');let uh=src==='ikg'?v.ikg*G.kg:src==='uh'?v.uh:v.rate*v.conc;
   if(iam&&uh>1000){uh=1000;m.push(['warn','IAM: máximo inicial de 1.000 U/h aplicado.']);v.uh=uh;v.rate=uh/v.conc;if(src!=='ikg')v.ikg=uh/G.kg;}
   else{if(src!=='uh')v.uh=uh;if(src!=='rate')v.rate=uh/v.conc;if(src!=='ikg')v.ikg=uh/G.kg;}

   if(ok(v.conc))m.push(`<b>Conversão:</b> U/kg/h = (mL/h × ${fmt(v.conc)}) ÷ peso`);needKg(m);}})],
 ['Diluição: 25.000 U (5 mL) + SF 245 mL → volume final 250 mL, 100 U/mL.',

B(T,'6.4.2 Escala de Raschke','ajuste pela relação TTPA',()=>[W({f:[{k:'r',l:'Relação TTPA',big:1},{k:'cur',l:'Velocidade atual',u:'mL/h',d:1},{k:'conc',l:'Concentração',u:'U/mL',v:100},

  calc(v,ch,S,m){let d=NaN,b=0,tx='';

B(T,'7.2 a 7.4 Conduta pela glicemia','',()=>[W({f:[{k:'g',l:'Glicemia',u:'mg/dL',big:1,d:0}],calc(v,ch,S,m){const g=v.g;if(!isFinite(g))return;

      if(b.kit){const l=h('label','','<input type="checkbox"> no kit');b.chk=$('input',l);b.chk.onchange=kitSummary;bh.append(l);KIT.push(b);}
      if(b.subt)bh.append(h('small','',b.subt));el.append(bh);
      const bb=h('div','bb');el.append(bb);b.widgets(b).forEach(w=>bb.append(w));
      if(b.notes.length){const d=h('details');if(b.open||!bb.children.length)d.open=true;d.append(h('summary','','Texto clínico'));
        d.append(h('ul','',b.notes.map(n=>{const c={'!':'al','*':'tip','~':'nt','+':'add'}[n[0]];const pre=n[0]==='~'?'<b>Correção:</b> ':n[0]==='+'?ADD:'';
          return `<li class="${c||'pl'}">${pre}${c?n.slice(1):n}</li>`;}).join('')));bb.append(d);}
      el.dataset.s=norm(b.title+' '+(b.subt||'')+' '+T.t+' '+b.notes.join(' '));grid.append(el);});
    main.append(sec);});
  show();kitSummary();
}
function show(){document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',+s.dataset.n===CUR));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',+b.dataset.n===CUR));}
function filter(){const q=norm($('#q').value.trim());document.body.classList.toggle('searching',!!q);let any=false;
  document.querySelectorAll('.tab').forEach(s=>{let n=0;s.querySelectorAll('.blk').forEach(b=>{const hit=!q||b.dataset.s.includes(q);b.style.display=hit?'':'none';if(hit)n++;});s.classList.toggle('empty',!n);if(n)any=true;});
  $('#none').style.display=q&&!any?'block':'none';}
function globals(){G.kg=num($('#g_kg').value);if(!(G.kg>0))G.kg=NaN;G.sex=$('#g_sex').value;G.age=num($('#g_age').value);G.h=num($('#g_h').value);
  const p=[],pi=ideal();if(isFinite(G.kg)&&isFinite(ACT()))p.push(`ACT ≈ ${fmt(ACT(),1)} L (peso × ${fmt(actFactor())})`);
  if(isFinite(pi)){p.push(`Peso ideal ≈ ${fmt(pi,1)} kg`);if(isFinite(G.kg))p.push(`Peso ajustado ≈ ${fmt(pi+.4*(G.kg-pi),1)} kg`);p.push('(Devine; acrescentado, só informativo)');}
  $('#der').textContent=p.length?p.join(' · '):'Sexo, idade e altura são opcionais. Os cálculos usam o peso informado.';
  ALL.forEach(f=>f());}
['g_kg','g_sex','g_age','g_h'].forEach(id=>{$('#'+id).addEventListener('input',globals);$('#'+id).addEventListener('change',globals);});
$('#q').addEventListener('input',filter);
$('#clr').onclick=()=>{['g_kg','g_age','g_h','q'].forEach(id=>$('#'+id).value='');$('#g_sex').value='';KITONLY=false;render();filter();globals();};
render();globals();
</script>
